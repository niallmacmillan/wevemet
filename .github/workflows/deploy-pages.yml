name: Deploy app to GitHub Pages

# Publishes the Faces & Names app (the wevemet/ folder) to GitHub Pages.
# Runs whenever the app changes on the default branch, and can also be
# triggered by hand from the Actions tab.

on:
  push:
    branches: [master]
    paths:
      - 'wevemet/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns Pages on automatically if it isn't already.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload wevemet/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wevemet

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
